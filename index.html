<style>
/* Layout: ein blumenumrankter Torbogen im Kerzenlicht öffnet sich; man tritt hindurch auf eine helle Fotowand mit Blumenkaskaden, der Text schwebt in einer Lichtwolke */
:root {
  --wall: #f4ece2;
  --wall-light: #fdf9f3;
  --wall-deep: #e7d8c6;
  --night: #241b17;
  --night-glow: #3d2d24;
  --ink: #4a3a31;
  --ink-soft: #7b6758;
  --rose: #d98b82;
  --rose-soft: rgba(217, 139, 130, .4);
  --sage: #8ba17f;
  --f-script: "Great Vibes", "Marck Script", cursive;
  --f-serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --f-caps: "Forum", "Cormorant Garamond", Georgia, serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--wall);
  color: var(--ink);
  font-family: var(--f-serif);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body.locked { overflow: hidden; }

/* ---------- Szene hinter dem Tor ---------- */
.scene {
  position: relative; min-height: 100%; box-sizing: border-box; overflow: hidden;
  display: grid; place-items: center;
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(85% 60% at 50% 44%, var(--wall-light) 0%, var(--wall) 52%, var(--wall-deep) 100%), var(--wall);
}
#flora { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.flame {
  position: absolute; width: 8px; height: 15px; margin: -15px 0 0 -4px; pointer-events: none;
  border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
  background: radial-gradient(circle at 50% 72%, #fffbe8 0%, #ffd77e 42%, rgba(255, 168, 70, 0) 74%);
  box-shadow: 0 0 22px 10px rgba(255, 204, 128, .32);
  transform-origin: 50% 100%;
  animation: flick 1.4s ease-in-out infinite alternate;
}
.flame:nth-child(2n) { animation-duration: 1.1s; animation-delay: -.4s; }
@keyframes flick {
  0% { transform: scale(1, 1) rotate(-2deg); }
  50% { transform: scale(.88, 1.1) rotate(2deg); }
  100% { transform: scale(1.06, .94) rotate(-1deg); }
}

.cloud {
  position: relative; z-index: 2;
  width: min(300px, 74vw); box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; gap: 13px;
  text-align: center; padding-block: 6px;
}
.cloud::before {
  content: ""; position: absolute; inset: -80px -46px; z-index: -1; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255, 252, 247, .97) 0%, rgba(255, 252, 247, .88) 58%, rgba(255, 252, 247, 0) 100%);
}
.caps {
  margin: 0; font-family: var(--f-caps); text-transform: uppercase;
  letter-spacing: .3em; padding-left: .3em; color: var(--ink-soft);
}
.welcome { font-size: 14px; }
.names {
  margin: 0; font-family: var(--f-script); font-weight: 400;
  font-size: clamp(44px, 13vw, 62px); line-height: .92; color: var(--ink);
  display: flex; flex-direction: column; align-items: center;
}
.names .amp { font-size: .62em; color: var(--rose); line-height: 1.1; }
.names .w { padding: .14em .32em; margin: -.14em -.32em; }
.js .names .w {
  -webkit-mask-image: linear-gradient(90deg, #000 40%, transparent 60%); mask-image: linear-gradient(90deg, #000 40%, transparent 60%);
  -webkit-mask-size: 250% 100%; mask-size: 250% 100%;
  -webkit-mask-position: 100% 0; mask-position: 100% 0;
}
.revealed .names .w { animation: write 1.5s cubic-bezier(.45, .1, .4, 1) .75s forwards; }
.revealed .names .w + .amp + .w { animation-delay: 1.65s; }
@keyframes write { to { -webkit-mask-position: 0 0; mask-position: 0 0; } }
.js .names .amp { opacity: 0; transform: scale(.4) rotate(-20deg); }
.revealed .names .amp { transition: opacity .8s ease 1.35s, transform 1s cubic-bezier(.3, 1.6, .5, 1) 1.35s; opacity: 1; transform: none; }
.family { font-size: 17px; margin-top: -4px; }
.sprig { width: 120px; height: auto; display: block; }
.block { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.label { font-size: 11px; color: var(--rose); margin-bottom: 4px; }
.date { margin: 0; font-family: var(--f-caps); font-size: 30px; letter-spacing: .1em; padding-left: .1em; font-variant-numeric: tabular-nums; }
.date-long { margin: 0; font-size: 19px; font-style: italic; color: var(--ink-soft); }
.date-long .time { font-family: var(--f-caps); font-style: normal; font-size: 21px; letter-spacing: .06em; color: var(--ink); }
.venue { margin: 0; font-size: 23px; font-weight: 500; line-height: 1.2; text-wrap: balance; }
.addr { margin: 6px 0 0; font-size: 18px; line-height: 1.4; color: var(--ink-soft); }
.actions { margin-top: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.btn {
  font-family: var(--f-caps); font-size: 12px; letter-spacing: .2em; padding: 10px 16px 10px calc(16px + .2em);
  text-transform: uppercase; color: var(--ink); text-decoration: none;
  border: 1px solid var(--rose-soft); border-radius: 999px; background: rgba(255, 255, 255, .55);
}
.btn:hover, .btn:focus-visible { border-color: var(--rose); outline: none; background: #fff; }
.countdown { display: flex; justify-content: center; gap: 16px; }
.countdown div { display: flex; flex-direction: column; align-items: center; min-width: 42px; }
.countdown b { font-family: var(--f-caps); font-weight: 400; font-size: 22px; line-height: 1.1; color: var(--rose); font-variant-numeric: tabular-nums; }
.countdown span { font-family: var(--f-caps); font-size: 9px; letter-spacing: .2em; padding-left: .2em; text-transform: uppercase; color: var(--ink-soft); }
.orb {
  position: absolute; border-radius: 50%; pointer-events: none; z-index: 1;
  background: radial-gradient(circle, rgba(255, 236, 200, .9) 0%, rgba(255, 220, 170, .35) 45%, rgba(255, 220, 170, 0) 70%);
  animation: orb var(--dur, 8s) ease-in-out infinite alternate;
}
@keyframes orb { from { transform: translate(0, 0) scale(.85); opacity: .35; } to { transform: translate(var(--dx, 10px), var(--dy, -20px)) scale(1.1); opacity: .85; } }
.closing { margin: 0; font-family: var(--f-script); font-size: 32px; line-height: 1.15; color: var(--ink); text-wrap: balance; }

.js .reveal {
  opacity: 0; transform: translateY(12px); filter: blur(4px);
  transition: opacity 1.2s ease, transform 1.2s ease, filter 1.2s ease;
  transition-delay: calc(var(--i, 0) * .14s + .3s);
}
.revealed .reveal { opacity: 1; transform: none; filter: none; }

#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 25; }
/* ---------- Intro: Blumenpforte im Vollbild ---------- */
.intro { display: none; }
.js .intro { display: block; position: fixed; inset: 0; z-index: 20; cursor: pointer; overflow: hidden; perspective: 700px; animation: introFallback .01s 11s forwards; }
.intro.gone { visibility: hidden; }
@keyframes introFallback { to { opacity: 0; visibility: hidden; } }
.glow {
  position: absolute; inset: 0; z-index: 1; opacity: 0; pointer-events: none;
  background: radial-gradient(65% 50% at 50% 46%, #fffdf6 0%, #fff0d6 45%, rgba(255, 236, 205, 0) 100%);
}
.open .glow { animation: glow 2.2s ease forwards; }
@keyframes glow { 15% { opacity: 1; } 100% { opacity: 0; } }
.leaf {
  position: absolute; top: 0; bottom: 0; width: calc(50% + 1px); z-index: 2; overflow: hidden;
  background: var(--wall);
  transition: transform 2.1s cubic-bezier(.62, 0, .25, 1), opacity .8s ease 1.3s;
}
.leaf.l { left: 0; transform-origin: left center; box-shadow: inset -1px 0 0 rgba(120, 85, 65, .25); }
.leaf.r { right: 0; transform-origin: right center; }
.open .leaf.l { transform: rotateY(-108deg); opacity: 0; }
.open .leaf.r { transform: rotateY(108deg); opacity: 0; }
.leaf::after { content: ""; position: absolute; inset: 0; z-index: 3; opacity: 0; pointer-events: none; transition: opacity 1.4s ease; }
.leaf.l::after { background: linear-gradient(90deg, rgba(50, 30, 22, .65), rgba(50, 30, 22, .1)); }
.leaf.r::after { background: linear-gradient(270deg, rgba(50, 30, 22, .65), rgba(50, 30, 22, .1)); }
.open .leaf::after { opacity: 1; }
.leaf canvas {
  position: absolute; top: 0; height: 100%; width: 200%;
  transform-origin: 50% 46%; animation: settle 3s cubic-bezier(.2, .7, .2, 1) both;
}
.leaf.l canvas { left: 0; }
.leaf.r canvas { left: -100%; }
@keyframes settle { from { transform: scale(1.14); } }
.medal {
  --md: min(58vw, 250px, 38vh);
  position: absolute; top: 46%; z-index: 2; width: var(--md); height: var(--md); margin-top: calc(var(--md) / -2);
  border-radius: 50%; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center;
  background: radial-gradient(circle at 50% 38%, #fffdf9, #f7efe4 68%, #eee2d2);
  box-shadow: 0 12px 34px rgba(90, 60, 40, .3), inset 0 0 0 7px #fbf6ef, inset 0 0 0 8px rgba(217, 139, 130, .6);
  animation: medalIn 1.3s cubic-bezier(.2, .8, .2, 1) .6s both;
}
.leaf.l .medal { right: calc(var(--md) / -2); }
.leaf.r .medal { left: calc(var(--md) / -2); }
@keyframes medalIn { from { opacity: 0; transform: scale(.82); } }
.medal .mcap { font-family: var(--f-caps); font-size: 10px; letter-spacing: .32em; padding-left: .32em; text-transform: uppercase; color: var(--ink-soft); }
.medal .mono { font-family: var(--f-script); font-size: calc(var(--md) * .27); line-height: 1; color: var(--ink); white-space: nowrap; }
.medal .mono em { font-style: normal; color: var(--rose); font-size: .7em; }
.medal .mdate { font-family: var(--f-caps); font-size: 12px; letter-spacing: .3em; padding-left: .3em; color: var(--ink-soft); }
.seam {
  position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; z-index: 4; pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 240, 205, 0), #fff4d6 14%, #ffe1a2 50%, #fff4d6 86%, rgba(255, 240, 205, 0));
  box-shadow: 0 0 12px 4px rgba(255, 212, 140, .9), 0 0 50px 16px rgba(255, 200, 120, .5);
  opacity: 0; transform: scaleY(0);
  animation: seamIn 1.1s cubic-bezier(.5, 0, .2, 1) 1.6s forwards;
}
@keyframes seamIn { to { opacity: 1; transform: none; } }
.open .seam { animation: seamOut .6s ease forwards; }
@keyframes seamOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: scaleX(40); } }
.iris {
  position: absolute; left: 50%; top: 46%; width: 2px; height: 2px; z-index: 5; border-radius: 50%; pointer-events: none;
  transform: translate(-50%, -50%); box-shadow: 0 0 120px 260vmax #1b1411;
  animation: iris 1.9s cubic-bezier(.35, .1, .2, 1) .15s forwards;
}
.vignette {
  position: absolute; inset: 0; z-index: 3; pointer-events: none; transition: opacity .6s ease;
  background: radial-gradient(75% 60% at 50% 46%, rgba(40, 24, 18, 0) 45%, rgba(40, 24, 18, .5) 100%);
}
.open .vignette { opacity: 0; }
@keyframes iris { to { width: 260vmax; height: 260vmax; } }
@media (prefers-reduced-motion: reduce) {
  .js .intro { display: none; }
  .js .reveal { opacity: 1; transform: none; filter: none; transition: none; }
  .flame, .orb, .rays, .rays::after { animation: none; }
  .js .names .w { -webkit-mask-image: none; mask-image: none; }
  .js .names .amp { opacity: 1; transform: none; }
}
</style>

<script>
(function () {
  var html = document.documentElement;
  html.classList.add('js');
  var TAU = Math.PI * 2;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Blumen zeichnen ---------- */
  function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  var HYD = ['#f7d9df', '#f0c4d0', '#f5e4d8', '#eef0dc', '#e2ebcf', '#f9e9e4', '#ecb9c6'];
  var YEL = ['#fff2bf', '#f6cd63', '#dc9d31'];
  var LEAF = ['#a9bb9c', '#8fa686', '#738f6b', '#5b7553'];

  function easeBack(k) { var c = 1.5; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); }

  function leafShape(c, L, w) {
    c.beginPath(); c.moveTo(0, 0);
    c.quadraticCurveTo(L * .5, -w, L, 0);

    c.strokeStyle = '#6d8463'; c.lineWidth = Math.max(.8, len * .016);
    c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(len * .5, len * .12, len, 0); c.stroke();

    for (var i = 1; i <= m; i++) {

    var R = rng(it.seed), rr = it.r * k; if (rr < 1) return;
    c.save(); c.translate(it.x, it.y);
    c.strokeStyle = 'rgba(130,150,112,.55)'; c.lineWidth = .7;
    for (var n = 0; n < 26; n++) {
      var ang = R() * TAU, dist = Math.sqrt(R()) * rr, x = Math.cos(ang) * dist, y = Math.sin(ang) * dist * .8, s = (1.1 + R() * 1.6) * Math.min(1, k * 1.5);
      if (n % 3 === 0) { c.beginPath(); c.moveTo(0, rr * .5); c.quadraticCurveTo(x * .3, y * .5 + rr * .2, x, y); c.stroke(); }
      c.fillStyle = 'rgba(190,175,155,.55)'; c.beginPath(); c.arc(x, y + .4, s + .5, 0, TAU); c.fill();
      c.fillStyle = '#fffdf8'; c.beginPath(); c.arc(x, y, s, 0, TAU); c.fill();
    }
    c.restore();
  }

  function drawRan(c, x, y, r) {
    c.fillStyle = 'rgba(120,80,30,.15)'; c.beginPath(); c.arc(x + r * .1, y + r * .12, r, 0, TAU); c.fill();
    c.fillStyle = YEL[0]; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
    c.fillStyle = YEL[1]; c.beginPath(); c.arc(x - r * .05, y - r * .04, r * .72, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.45)'; c.lineWidth = Math.max(.5, r * .06);
    c.beginPath(); c.arc(x, y, r * .86, 0, TAU); c.stroke();
    c.fillStyle = YEL[2]; c.beginPath(); c.arc(x - r * .08, y - r * .06, r * .32, 0, TAU); c.fill();
  }

  function drawSprig(c, it, k) {
    var len = it.len * k; if (len < 2) return;
    var ex = it.x + Math.cos(it.a) * len, ey = it.y + Math.sin(it.a) * len;
    var mx = it.x + Math.cos(it.a + .25) * len * .5, my = it.y + Math.sin(it.a + .25) * len * .5;
    c.strokeStyle = '#7d9470'; c.lineWidth = 1.1;
    c.beginPath(); c.moveTo(it.x, it.y); c.quadraticCurveTo(mx, my, ex, ey); c.stroke();
    c.fillStyle = '#8fa686';
    c.save(); c.translate(mx, my); c.rotate(it.a - .8); leafShape(c, len * .2, len * .05); c.restore();
    if (k > .5) drawRan(c, ex, ey, it.len * .1 * Math.min(1, (k - .5) * 2.4));
  }

  function drawCandle(c, cd) {
    var g = c.createRadialGradient(cd.x, cd.y - cd.h, 0, cd.x, cd.y - cd.h, cd.h * 1.6);
    g.addColorStop(0, 'rgba(255,214,150,.42)'); g.addColorStop(1, 'rgba(255,214,150,0)');
    c.fillStyle = g; c.beginPath(); c.arc(cd.x, cd.y - cd.h, cd.h * 1.6, 0, TAU); c.fill();
    var x = cd.x - cd.w / 2, y = cd.y - cd.h;
    g = c.createLinearGradient(x, 0, x + cd.w, 0);
    g.addColorStop(0, '#f2e6d2'); g.addColorStop(.45, '#fffaf1'); g.addColorStop(1, '#e8d9c2');
    c.fillStyle = g; c.fillRect(x, y, cd.w, cd.h);
    c.fillStyle = '#f6ecdc'; c.beginPath(); c.ellipse(cd.x, y, cd.w / 2, cd.w * .12, 0, 0, TAU); c.fill();
    c.strokeStyle = '#5a4636'; c.lineWidth = 1; c.beginPath(); c.moveTo(cd.x, y); c.lineTo(cd.x, y - 4); c.stroke();
  }

  var DRAW = { leaf: drawLeaf, rose: drawRose, hyd: drawHyd, breath: drawBreath, sprig: drawSprig,
    ran: function (c, it, k) { var r = it.r * easeBack(k); if (r > .5) drawRan(c, it.x, it.y, r); } };

  function cluster(items, r, x, y, u, dir, heavy, d) {
    var n, i, j = function (s) { return (r() - .5) * u * s; };
    n = 2 + Math.floor(r() * 3);
    for (i = 0; i < n; i++) items.push({ t: 'leaf', x: x + j(.6), y: y + j(.6), len: u * (1.1 + r() * 1.1), a: dir + (r() - .5) * 2.6, kind: r() < .55 ? 0 : 1, c: pick(r, LEAF), d: d + r() * 200, L: 0 });
    if (r() < .6) items.push({ t: 'hyd', x: x + j(.8), y: y + j(.8), r: u * (.5 + r() * .35), seed: r() * 1e9 | 0, d: d + r() * 250, L: 1 });
    n = 1 + (heavy ? 1 : 0) + (r() < .45 ? 1 : 0);
    for (i = 0; i < n; i++) items.push({ t: 'rose', x: x + j(.95), y: y + j(.95), r: u * (.4 + r() * .3) * (heavy ? 1.15 : 1), c: pick(r, ROSES), rot: r() * TAU, d: d + 120 + r() * 300, L: 2 });
    if (r() < .3) items.push({ t: 'ran', x: x + j(1.1), y: y + j(1.1), r: u * (.2 + r() * .08), d: d + 220 + r() * 300, L: 2 });
    if (r() < .7) items.push({ t: 'breath', x: x + j(1.1), y: y + j(1.1), r: u * (.45 + r() * .4), seed: r() * 1e9 | 0, d: d + 320 + r() * 300, L: 3 });
    if (r() < .3) items.push({ t: 'sprig', x: x, y: y, len: u * (1.3 + r() * 1.1), a: dir + (r() - .5) * 1.3, d: d + 380 + r() * 300, L: 1.5 });
  }

  function fit(cv) {
    var dpr = Math.min(window.devicePixelRatio || 1, 2), b = cv.getBoundingClientRect(), c = cv.getContext('2d');
    cv.width = Math.round(b.width * dpr); cv.height = Math.round(b.height * dpr);
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { c: c, w: b.width, h: b.height };
  }

  function paint(f, items, candles, t, dur) {
    f.c.clearRect(0, 0, f.w, f.h);
    for (var i = 0; i < items.length; i++) {
      var it = items[i], k = Math.max(0, Math.min(1, (t - it.d) / dur));
      if (k > 0) DRAW[it.t](f.c, it, k);
    }
    if (candles) for (i = 0; i < candles.length; i++) drawCandle(f.c, candles[i]);
  }

  function grow(f, items, candles, dur, animate) {
    items.sort(function (a, b) { return a.L - b.L; });
    if (!animate) { paint(f, items, candles, 1e9, dur); return; }
    var end = 0; items.forEach(function (it) { end = Math.max(end, it.d); }); end += dur;
    var t0 = performance.now();
    (function step(now) {
      var t = now - t0;
      paint(f, items, t > end * .5 ? candles : null, t, dur);
      if (t < end) requestAnimationFrame(step); else paint(f, items, candles, 1e9, dur);
    })(t0);
  }

  /* ---------- Szene: Blumenkaskaden wie an der Fotowand ---------- */
  var scene = document.getElementById('scene'), floraCv = document.getElementById('flora'), flames = document.getElementById('flames');
  var sceneGrown = false;

  function sceneLayout(w, h) {
    var r = rng(20270606), items = [], wallW = Math.min(w, 620), L = w / 2 - wallW / 2, Rx = w / 2 + wallW / 2;
    var u = Math.max(34, Math.min(48, wallW / 9.5)), n, i, t, x, y;
    n = Math.ceil(h / (u * 1.2));
    for (i = 0; i <= n; i++) {
      t = i / n; y = -u * .4 + t * (h + u * .5);
      x = L + u * .3 + Math.sin(t * 7.3) * u * .3 + (t < .16 ? u * .7 * (1 - t / .16) : 0) + (t > .84 ? u * .9 * ((t - .84) / .16) : 0);
      cluster(items, r, x, y, u, r() < .5 ? -.35 : Math.PI + .35, t < .14 || t > .86, (1 - t) * 1300);
    }
    n = Math.ceil(h * .74 / (u * 1.2));
    for (i = 0; i <= n; i++) {
      t = i / n; y = h * .27 + t * (h * .73 + u * .3);
      x = Rx - u * .3 - Math.sin(t * 6.1 + 1) * u * .3 - (t > .78 ? u * 1.1 * ((t - .78) / .22) : 0);
      cluster(items, r, x, y, u * (t < .15 ? .75 : 1), r() < .5 ? Math.PI + .35 : -.35, t > .8, (1 - t) * 1100 + 150);
    }
    cluster(items, r, Rx - u * .2, u * .5, u * .7, Math.PI * .8, false, 900);
    cluster(items, r, Rx - u * .1, u * 1.5, u * .55, Math.PI * .9, false, 1000);
    var candles = [
      { x: L + u * 2.2, y: h - u * .25, h: u * 1.1, w: u * .42 },
      { x: L + u * 2.85, y: h - u * .1, h: u * .7, w: u * .4 },
      { x: Rx - u * 2.4, y: h - u * .15, h: u * .95, w: u * .42 }
    ];
    return { items: items, candles: candles };
  }

  function renderScene(animate) {
    var f = fit(floraCv), lay = sceneLayout(f.w, f.h);
    grow(f, lay.items, lay.candles, 650, animate);
    flames.innerHTML = '';
    lay.candles.forEach(function (cd) {
      var el = document.createElement('span'); el.className = 'flame';
      el.style.left = cd.x + 'px'; el.style.top = (cd.y - cd.h - 3) + 'px';
      if (animate) { el.style.opacity = 0; el.style.transition = 'opacity 1s ease 1.4s'; requestAnimationFrame(function () { el.style.opacity = 1; }); }
      flames.appendChild(el);
    });
    sceneGrown = true;
  }

  var rt;
  addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (sceneGrown) renderScene(false); }, 200); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (sceneGrown) renderScene(false); });

  /* ---------- Countdown ---------- */
  var WEDDING = Date.UTC(2027, 5, 6, 14, 0, 0); // 16:00 in Wuppertal (MESZ)
  function plural(n, one, few, many) { var a = n % 10, b = n % 100; return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many; }
  function two(n) { return (n < 10 ? '0' : '') + n; }
  function tickCountdown() {
    var ms = WEDDING - Date.now(), el = document.getElementById('countdown');
    if (ms <= 0) { el.hidden = true; return; }
    var s = Math.floor(ms / 1000), d = Math.floor(s / 86400);
    document.getElementById('cd-d').textContent = d;
    document.getElementById('cd-dl').textContent = plural(d, 'день', 'дня', 'дней');
    document.getElementById('cd-h').textContent = two(Math.floor(s % 86400 / 3600));
    document.getElementById('cd-m').textContent = two(Math.floor(s % 3600 / 60));
    document.getElementById('cd-s').textContent = two(s % 60);
  }
  tickCountdown(); setInterval(tickCountdown, 1000);

  /* ---------- Kalendereintrag ---------- */
  var ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Daniel und Miriam//Svadba//RU', 'BEGIN:VEVENT',
    'UID:svadba-20270606@danieldavydov1998.github.io', 'DTSTAMP:20261029T000000Z',
    'DTSTART:20270606T140000Z', 'DTEND:20270606T220000Z',
    'SUMMARY:Свадьба Даниэля и Мириам',
    'LOCATION:Historische Stadthalle Wuppertal\\, Johannisberg 40\\, 42103 Wuppertal',
    'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  document.getElementById('cal').href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);

  /* ---------- Lichter in der Szene ---------- */
  if (!reduce) {
    var orbR = rng(77);
    for (var oi = 0; oi < 14; oi++) {
      var orb = document.createElement('span'), sz = 18 + orbR() * 56;
      orb.className = 'orb';
      orb.style.cssText = 'width:' + sz + 'px;height:' + sz + 'px;left:' + (orbR() * 100) + '%;top:' + (orbR() * 100) + '%;--dur:' + (6 + orbR() * 7) + 's;--dx:' + ((orbR() - .5) * 50) + 'px;--dy:' + ((orbR() - .5) * 60) + 'px;animation-delay:' + (-orbR() * 8) + 's';
      scene.appendChild(orb);
    }
  }

  /* ---------- Funken und Blütenblätter ---------- */
  var fx = (function () {
    var cv = document.getElementById('fx'), f = fit(cv), R = Math.random, ps = [], ambient = 0, running = false, last = 0;
    addEventListener('resize', function () { f = fit(cv); });
    function petal(x, y, vx, vy, life) { return { k: 'p', x: x, y: y, vx: vx, vy: vy, s: 5 + R() * 6, rot: R() * TAU, vr: (R() - .5) * 5, spin: R() * TAU, ph: R() * TAU, sw: 12 + R() * 18, c: pick(R, ROSES)[R() < .5 ? 0 : 1], life: life, age: 0 }; }
    function fall(top) { var p = petal(R() * f.w, top ? -20 : R() * f.h, 0, 18 + R() * 22, 1e9); p.k = 'a'; p.vr = (R() - .5) * 1.4; return p; }
    function burst(x, y, nS, nP, power) {
      for (var i = 0; i < nS; i++) { var a = R() * TAU, v = power * (.25 + R() * .85); ps.push({ k: 's', x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: .8 + R() * 2.2, life: 1 + R() * 1.4, age: 0, tw: R() * TAU }); }
      for (i = 0; i < nP; i++) { a = R() * TAU; v = power * (.35 + R() * .75); ps.push(petal(x, y, Math.cos(a) * v, Math.sin(a) * v - power * .15, 2.4 + R() * 1.4)); }
      start();
    }
    function setAmbient(n) { ambient = n; for (var i = 0; i < n; i++) ps.push(fall(false)); start(); }
    function start() { if (running || reduce) return; running = true; last = performance.now(); requestAnimationFrame(step); }
    function step(now) {
      var dt = Math.min(.05, (now - last) / 1000), c = f.c; last = now;
      c.clearRect(0, 0, f.w, f.h);
      for (var i = ps.length - 1; i >= 0; i--) {
        var p = ps[i]; p.age += dt;
        if (p.age > p.life) { ps.splice(i, 1); continue; }
        if (p.k === 'a') {
          p.y += p.vy * dt; p.ph += dt * .9; p.rot += p.vr * dt; p.spin += dt * 2.2;
          if (p.y > f.h + 20) { ps[i] = fall(true); continue; }
        } else {
          var drag = Math.exp(-dt * (p.k === 's' ? 2.2 : 1.6));
          p.vx *= drag; p.vy *= drag; p.vy += (p.k === 's' ? 14 : 46) * dt;
          p.x += p.vx * dt; p.y += p.vy * dt;
          if (p.k === 'p') { p.ph += dt; p.rot += p.vr * dt; p.spin += dt * 3; }
        }
        var fade = Math.min(1, (p.life - p.age) * 1.5);
        if (p.k === 's') {
          var tw = .55 + .45 * Math.sin(p.tw + p.age * 18);
          c.globalCompositeOperation = 'lighter';
          c.globalAlpha = .28 * fade * tw; c.fillStyle = '#ffd88f';
          c.beginPath(); c.arc(p.x, p.y, p.r * 4, 0, TAU); c.fill();
          c.globalAlpha = fade * tw; c.fillStyle = '#fff4d6';
          c.beginPath(); c.arc(p.x, p.y, p.r, 0, TAU); c.fill();
          c.globalCompositeOperation = 'source-over';
        } else {
          c.save(); c.translate(p.x + (p.k === 'a' ? Math.sin(p.ph) * p.sw : 0), p.y); c.rotate(p.rot); c.scale(Math.max(.2, Math.abs(Math.cos(p.spin))), 1);
          c.globalAlpha = .85 * fade; c.fillStyle = p.c;
          c.beginPath(); c.ellipse(0, 0, p.s, p.s * .72, 0, 0, TAU); c.fill();
          c.restore();
        }
      }
      c.globalAlpha = 1;
      requestAnimationFrame(step);
    }
    return { burst: burst, ambient: setAmbient };
  })();

  function nameSparkles() {
    var ws = document.querySelectorAll('.names .w');
    [[ws[0], 2250], [ws[1], 3150]].forEach(function (p) {
      setTimeout(function () { var b = p[0].getBoundingClientRect(); fx.burst(b.right - b.width * .12, b.top + b.height * .5, 22, 0, 110); }, p[1]);
    });
  }

  scene.addEventListener('pointerdown', function (e) {
    if (e.target.closest('a')) return;
    fx.burst(e.clientX, e.clientY, 18, 12, 230);
  });

  /* ---------- Pforte ---------- */
  var intro = document.getElementById('intro');

  if (reduce) {
    intro.parentNode.removeChild(intro);
    renderScene(false); html.classList.add('revealed');
    return;
  }

  function wallLayout(w, h, md) {
    var r = rng(6062027), items = [], u = Math.max(30, Math.min(46, w / 9)), sp = u * 1.15, cx = w / 2, cy = h * .46, clear = md / 2 + u * .1, row = 0;
    for (var y = -u * .3; y < h + u * .5; y += sp, row++) {
      for (var x = -u * .3 + (row % 2 ? sp / 2 : 0); x < w + u * .5; x += sp) {
        var jx = x + (r() - .5) * sp * .5, jy = y + (r() - .5) * sp * .5, dist = Math.hypot(jx - cx, jy - cy);
        if (dist < clear) continue;
        var ring = dist < clear + u * 1.2;
        cluster(items, r, jx, jy, u * (ring ? .9 : 1), r() * TAU, ring || r() < .25, 0);
      }
    }
    return items;
  }

  document.body.classList.add('locked');
  var wl = document.getElementById('wallL'), wr = document.getElementById('wallR');
  var wf = fit(wl), md = intro.querySelector('.medal').getBoundingClientRect().width || Math.min(wf.w * .58, 250);
  var wallItems = wallLayout(wf.w, wf.h, md);
  wallItems.sort(function (a, b) { return a.L - b.L; });
  paint(wf, wallItems, null, 1e9, 1);
  var wrf = fit(wr); wrf.c.setTransform(1, 0, 0, 1, 0, 0); wrf.c.drawImage(wl, 0, 0);

  var timers = [], opened = false, sparkTimer;
  function at(ms, fn) { timers.push(setTimeout(fn, ms)); }
  at(1700, function () {
    sparkTimer = setInterval(function () { fx.burst(innerWidth / 2, innerHeight * (.08 + Math.random() * .84), 2, 0, 70); }, 60);
  });
  function open() {
    if (opened) return; opened = true;
    timers.forEach(clearTimeout); clearInterval(sparkTimer);
    intro.classList.add('open');
    renderScene(true);
    var W = innerWidth, H = innerHeight;
    for (var k = 0; k < 6; k++) fx.burst(W / 2, H * (.08 + k * .17), 10, 9, 430);
    fx.burst(W / 2, H * .46, 70, 0, 540);
    setTimeout(function () { html.classList.add('revealed'); nameSparkles(); }, 550);
    setTimeout(done, 2300);
  }
  function done() {
    intro.classList.add('gone');
    document.body.classList.remove('locked');
    setTimeout(function () { if (intro.parentNode) intro.parentNode.removeChild(intro); }, 600);
    fx.ambient(16);
  }
  at(3000, open);
  intro.addEventListener('click', open);
})();
</script>
