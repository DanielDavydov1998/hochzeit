<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15302a">
<meta name="description" content="Свадьба Даниэля и Мириам · 06.06.2027 · Historische Stadthalle Wuppertal">
<meta property="og:title" content="Даниэль &amp; Мириам · Свадьба">
<meta property="og:description" content="06.06.2027 · Historische Stadthalle Wuppertal">
<meta property="og:type" content="website">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Даниэль и Мириам</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Forum&display=swap">
<style>
/* Layout: eine schmale, gerahmte Karte auf dunkelgrünem Samt; Intro = Umschlag mit Wachssiegel, der sich öffnet */
:root {
  --bg: #15302a;
  --bg-glow: #234a40;
  --paper: #f4ecdf;
  --ink: #f1e8d8;
  --ink-soft: #c9bfa9;
  --gold: #c8a65f;
  --gold-dim: rgba(200, 166, 95, .45);
  --wax: #7a1f2e;
  --wax-hi: #a8394a;
  --env: #1d3d35;
  --env-flap: #24493f;
  --env-in: #0f2420;
  --f-display: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --f-label: "Forum", "Cormorant Garamond", Georgia, serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 70% at 50% 0%, var(--bg-glow), var(--bg) 70%) fixed, var(--bg);
  color: var(--ink);
  font-family: var(--f-display);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
#dust { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

/* ---------- Einladung ---------- */
.page {
  position: relative; z-index: 1;
  min-height: 100%;
  display: grid; place-items: center;
  padding-block: 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.invite {
  width: 100%; max-width: 400px; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; gap: 22px;
  text-align: center;
  padding: 52px 26px 48px;
  border: 1px solid var(--gold-dim);
  box-shadow: inset 0 0 0 7px var(--bg), inset 0 0 0 8px var(--gold-dim);
  background: rgba(10, 28, 24, .35);
}
.eyebrow, .label {
  font-family: var(--f-label);
  text-transform: uppercase; letter-spacing: .32em;
  color: var(--gold); margin: 0;
}
.eyebrow { font-size: 15px; padding-left: .32em; }
.label { font-size: 12px; padding-left: .32em; margin-bottom: 10px; }
.names {
  margin: 0; font-weight: 400; font-style: italic;
  font-size: clamp(44px, 13vw, 58px); line-height: 1;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  text-wrap: balance;
}
.names .amp { font-size: .6em; color: var(--gold); font-style: italic; }
.family {
  margin: -6px 0 0; font-family: var(--f-label);
  font-size: 20px; letter-spacing: .24em; padding-left: .24em; text-transform: uppercase;
  color: var(--ink-soft);
}
.flourish { width: 170px; max-width: 100%; height: auto; color: var(--gold); display: block; }
.block { display: flex; flex-direction: column; align-items: center; }
.date-big {
  margin: 0; font-family: var(--f-label); font-size: 38px; letter-spacing: .08em;
  font-variant-numeric: tabular-nums; color: var(--ink);
}
.date-long { margin: 4px 0 0; font-size: 19px; font-style: italic; color: var(--ink-soft); }
.venue { margin: 0; font-size: 25px; font-weight: 500; line-height: 1.2; text-wrap: balance; }
.addr { margin: 8px 0 0; font-size: 19px; line-height: 1.4; color: var(--ink-soft); }
.map {
  margin-top: 14px; font-family: var(--f-label); font-size: 13px;
  letter-spacing: .18em; text-transform: uppercase; color: var(--gold);
  text-decoration: none; padding: 10px 18px; border: 1px solid var(--gold-dim); border-radius: 999px;
}
.map:hover, .map:focus-visible { background: rgba(200, 166, 95, .12); outline: none; }
.closing { margin: 0; font-size: 26px; font-style: italic; line-height: 1.3; text-wrap: balance; }

.reveal { animation: rise 1s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(3.4s + var(--i, 0) * .14s); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }

/* ---------- Intro: Umschlag ---------- */
.intro {
  position: fixed; inset: 0; z-index: 10;
  display: grid; place-items: center; align-content: center; gap: 30px;
  background: radial-gradient(120% 70% at 50% 30%, var(--bg-glow), var(--bg) 70%), var(--bg);
  animation: introOut .9s ease 3.2s forwards;
  cursor: pointer;
}
@keyframes introOut { to { opacity: 0; visibility: hidden; } }
.env {
  position: relative; width: min(76vw, 320px); max-width: 100%; aspect-ratio: 3 / 2;
  perspective: 900px;
  animation: envIn .8s cubic-bezier(.2,.8,.2,1) both, envOut .9s ease 3.0s forwards;
}
@keyframes envIn { from { opacity: 0; transform: translateY(24px) scale(.92); } }
@keyframes envOut { to { transform: scale(1.08); } }
.env-back { position: absolute; inset: 0; background: var(--env-in); border-radius: 6px; box-shadow: 0 24px 50px rgba(0,0,0,.45); }
.env-card {
  position: absolute; left: 7%; right: 7%; top: 7%; bottom: 5%; z-index: 2;
  background: var(--paper); border-radius: 3px;
  display: grid; place-items: center;
  animation: cardUp 1s cubic-bezier(.3,.7,.2,1) 2.0s forwards;
}
.env-card span {
  font-family: var(--f-display); font-style: italic; font-size: 34px; color: var(--bg);
  border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold); padding: 2px 14px;
}
@keyframes cardUp { to { transform: translateY(-58%); } }
.env-front {
  position: absolute; inset: 0; z-index: 3; border-radius: 6px;
  background: linear-gradient(170deg, var(--env-flap), var(--env));
  clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
}
.env-front::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to bottom right, transparent 49.6%, var(--gold-dim) 50%, transparent 50.4%),
              linear-gradient(to bottom left, transparent 49.6%, var(--gold-dim) 50%, transparent 50.4%);
  opacity: .35;
}
.env-flap {
  position: absolute; left: 0; right: 0; top: 0; height: 60%; z-index: 4;
  background: linear-gradient(180deg, var(--env-flap), var(--env));
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top center;
  animation: flap .8s cubic-bezier(.5,0,.3,1) 1.25s forwards;
}
@keyframes flap {
  0% { transform: rotateX(0); z-index: 4; }
  55% { z-index: 4; }
  56% { z-index: 1; }
  100% { transform: rotateX(180deg); z-index: 1; }
}
.seal {
  position: absolute; left: 50%; top: 60%; z-index: 5;
  width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, var(--wax-hi), var(--wax) 65%);
  box-shadow: 0 3px 8px rgba(0,0,0,.4), inset 0 0 0 4px rgba(0,0,0,.12);
  display: grid; place-items: center;
  font-family: var(--f-display); font-style: italic; font-size: 21px; color: #e9c98c;
  animation: seal .5s ease .85s forwards;
}
@keyframes seal { 40% { transform: scale(1.15); } to { transform: scale(.4); opacity: 0; } }
.intro-names {
  margin: 0; font-family: var(--f-label); font-size: 14px; letter-spacing: .34em; padding-left: .34em;
  text-transform: uppercase; color: var(--gold);
  animation: envIn .9s ease .3s both;
}

.skip .intro { display: none; }
.skip .reveal { animation: none; }

@media (prefers-reduced-motion: reduce) {
  .intro { display: none; }
  .reveal { animation: none; }
}
</style>
</head>
<body>

<canvas id="dust" aria-hidden="true"></canvas>

<div class="intro" id="intro" aria-hidden="true">
  <div class="env">
    <div class="env-back"></div>
    <div class="env-card"><span>Д &amp; М</span></div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <div class="seal">Д&amp;М</div>
  </div>
  <p class="intro-names">Даниэль &amp; Мириам</p>
</div>

<main class="page">
  <article class="invite">
    <p class="eyebrow reveal" style="--i:0">Свадьба</p>

    <h1 class="names reveal" style="--i:1">
      <span>Даниэль</span>
      <span class="amp">&amp;</span>
      <span>Мириам</span>
    </h1>
    <p class="family reveal" style="--i:2">Давыдовы</p>

    <svg class="flourish reveal" style="--i:3" viewBox="0 0 200 20" aria-hidden="true">
      <path d="M8 10H84M116 10H192" stroke="currentColor" stroke-width="1"/>
      <path d="M100 2L108 10L100 18L92 10Z" fill="none" stroke="currentColor" stroke-width="1"/>
      <circle cx="100" cy="10" r="2" fill="currentColor"/>
    </svg>

    <section class="block reveal" style="--i:4">
      <p class="label">Дата</p>
      <p class="date-big">06.06.2027</p>
      <p class="date-long">6 июня 2027 года</p>
    </section>

    <section class="block reveal" style="--i:5">
      <p class="label">Место</p>
      <p class="venue">Historische Stadthalle Wuppertal</p>
      <p class="addr">Johannisberg 40<br>42103 Wuppertal</p>
      <a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Historische+Stadthalle+Wuppertal+Johannisberg+40+42103+Wuppertal" target="_blank" rel="noopener">Открыть на карте</a>
    </section>

    <svg class="flourish reveal" style="--i:6" viewBox="0 0 200 20" aria-hidden="true">
      <path d="M8 10H84M116 10H192" stroke="currentColor" stroke-width="1"/>
      <path d="M100 2L108 10L100 18L92 10Z" fill="none" stroke="currentColor" stroke-width="1"/>
      <circle cx="100" cy="10" r="2" fill="currentColor"/>
    </svg>

    <p class="closing reveal" style="--i:7">Будем рады видеть вас!</p>
  </article>
</main>

<script>
(function () {
  var intro = document.getElementById('intro');
  intro.addEventListener('click', function () { document.documentElement.classList.add('skip'); });

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var c = document.getElementById('dust'), ctx = c.getContext('2d');
  var gold = getComputedStyle(document.documentElement).getPropertyValue('--gold').trim() || '#c8a65f';
  var d = window.devicePixelRatio || 1, w, h, parts = [];
  function size() { w = c.width = innerWidth * d; h = c.height = innerHeight * d; }
  function spawn(anywhere) {
    return { x: Math.random() * w, y: anywhere ? Math.random() * h : h + 10,
             r: (Math.random() * 1.5 + .4) * d, v: Math.random() * .35 + .12,
             a: Math.random() * .5 + .25, ph: Math.random() * 6.28 };
  }
  size(); addEventListener('resize', size);
  for (var i = 0; i < 46; i++) parts.push(spawn(true));
  function tick(t) {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = gold;
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.y -= p.v * d;
      p.x += Math.sin(t / 1600 + p.ph) * .25 * d;
      if (p.y < -10) parts[i] = p = spawn(false);
      ctx.globalAlpha = p.a * (.55 + .45 * Math.sin(t / 650 + p.ph));
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.29); ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
